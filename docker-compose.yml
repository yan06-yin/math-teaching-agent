version: "3.8"

services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8000"
    volumes:
      - app-data:/app/database
      - app-uploads:/app/uploads
    env_file:
      - backend/.env
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
  app-uploads:
