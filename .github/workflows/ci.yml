name: CI — 后端测试 + 代码检查

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ruff 代码检查
      run: |
        pip install ruff
        ruff check . --ignore E402,F403,F405 --line-length 140

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 运行 API 基础测试
      run: |
        python -m pytest test_api.py -v --tb=short

    - name: 运行综合测试
      run: |
        python -m pytest test_comprehensive.py -v --tb=short
